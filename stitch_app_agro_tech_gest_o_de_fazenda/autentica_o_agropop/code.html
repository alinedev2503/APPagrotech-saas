<!DOCTYPE html>

<html lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AgroPop - Login &amp; Cadastro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6dec13",
                        "background-light": "#f7f8f6",
                        "background-dark": "#182210",
                        "olive": "#3d4a2d",
                        "earth": "#5c4033",
                        "rust": "#8b4513"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .industrial-texture {
            background-color: #f7f8f6;
            background-image: radial-gradient(#3d4a2d 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            background-opacity: 0.05;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden industrial-texture">
<div class="layout-container flex h-full grow flex-col">
<!-- Main Content Wrapper -->
<main class="flex flex-1 items-center justify-center p-4 sm:p-8">
<div class="layout-content-container flex flex-col max-w-[480px] w-full bg-white dark:bg-slate-900/50 shadow-2xl rounded-xl border border-olive/10 dark:border-white/5 overflow-hidden">
<!-- Header Visual -->
<div class="relative h-48 w-full overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent z-10"></div>
<img alt="Wide view of a lush green farm field at sunrise" class="w-full h-full object-cover" data-alt="Wide view of a lush green farm field at sunrise" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB89EhYsThIvZrcrVehMU8PEqlkYVt1pRXf3wNQmCwBHV9DiLGAsYcCzGekz66xudW_ew8fiOwHtt7ZvlDpPf1Vz5h5piEZcj1P7PrsJrq9ab66SB6r9LXejnRWgFfcHc270ScJ5IaAeAjH_82WgDS0AdI0OxI3lhUY1wWkHVsXtjbxdkDCMpLl02FM2B31K1lQ5dOnxnwPpHRSK5V0he9tHTU8aL4Goib7Xfm5dGEnP39cMGUSJm93b2qRfLln7qLilta1M9-W8XA3"/>
<div class="absolute bottom-6 left-8 z-20">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-3xl">potted_plant</span>
<h1 class="text-white text-3xl font-black tracking-tight">AgroPop</h1>
</div>
<p class="text-slate-300 text-sm font-medium uppercase tracking-widest">Tecnologia no Campo</p>
</div>
</div>
<!-- Tabs -->
<div class="flex border-b border-olive/10 dark:border-white/5">
<button class="flex-1 py-4 text-center font-bold text-sm border-b-2 border-primary text-primary">ENTRAR</button>
<button class="flex-1 py-4 text-center font-bold text-sm text-slate-500 hover:text-olive transition-colors">CADASTRAR</button>
</div>
<div class="p-8 space-y-6">
<!-- Welcome Text -->
<div class="space-y-1">
<h2 class="text-2xl font-bold text-olive dark:text-slate-100">Bem-vindo de volta</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm">Acesse sua conta para gerenciar sua produção.</p>
</div>
<!-- Form -->
<form class="space-y-4">
<div class="space-y-2">
<label class="text-sm font-semibold text-olive dark:text-slate-200 flex items-center gap-2">
<span class="material-symbols-outlined text-base">mail</span> E-mail
                                </label>
<input class="w-full rounded-lg border-olive/20 dark:border-white/10 bg-background-light dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-primary focus:border-primary h-12 px-4 transition-all" placeholder="seu@email.com.br" type="email"/>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="text-sm font-semibold text-olive dark:text-slate-200 flex items-center gap-2">
<span class="material-symbols-outlined text-base">lock</span> Senha
                                    </label>
<a class="text-xs font-bold text-primary hover:underline uppercase tracking-tighter" href="#">Esqueci minha senha</a>
</div>
<div class="relative">
<input class="w-full rounded-lg border-olive/20 dark:border-white/10 bg-background-light dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-primary focus:border-primary h-12 px-4 transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Big Login Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-black text-lg py-5 rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-3 mt-4 group">
                                ENTRAR NO AGROPOP
                                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-olive/10 dark:border-white/10"></div>
<span class="flex-shrink mx-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Ou continue com</span>
<div class="flex-grow border-t border-olive/10 dark:border-white/10"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 h-12 rounded-lg border border-olive/20 dark:border-white/10 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-bold">Google</span>
</button>
<button class="flex items-center justify-center gap-2 h-12 rounded-lg border border-olive/20 dark:border-white/10 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
<svg class="w-5 h-5 dark:fill-white" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05 1.72-3.21 1.72-1.14 0-1.51-.71-2.84-.71-1.33 0-1.75.69-2.84.71-1.09.02-2.11-.87-3.11-1.87-2.05-2.03-3.12-5.78-3.12-8.39 0-4.14 2.61-6.32 5.11-6.32 1.33 0 2.44.81 3.26.81.79 0 2.14-.94 3.65-.94 1.25 0 2.45.54 3.26 1.37-2.92 1.65-2.45 5.86.41 7.15-.9 1.93-2.11 3.91-3.57 5.47zm-3.66-16.14c.64-.78 1.07-1.85.95-2.94-1 .04-2.21.67-2.92 1.5-.64.74-1.2 1.84-1.05 2.9.11 0 .22.01.34.01.88 0 1.96-.6 2.68-1.47z"></path>
</svg>
<span class="text-sm font-bold">Apple</span>
</button>
</div>
<!-- Footer Link -->
<div class="text-center pt-4">
<p class="text-sm text-slate-500">
                                Ainda não tem uma conta? 
                                <a class="text-primary font-bold hover:underline" href="#">Criar conta agora</a>
</p>
</div>
</div>
</div>
</main>
<!-- Bottom Nav (Mobile Inspired) -->
<footer class="p-6 text-center text-slate-400 text-xs flex flex-col gap-2">
<div class="flex justify-center gap-4 mb-2">
<a class="hover:text-primary transition-colors" href="#">Privacidade</a>
<a class="hover:text-primary transition-colors" href="#">Termos de Uso</a>
<a class="hover:text-primary transition-colors" href="#">Suporte</a>
</div>
<p>© 2024 AgroPop S.A. - O Futuro é Sustentável</p>
</footer>
</div>
</div>
</body></html>
